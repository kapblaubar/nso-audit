name: Validate application and infrastructure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Compile infrastructure and Dev SQL parameters
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/sql.bicep --stdout > /dev/null
          az bicep build-params --file infra/sql.dev.bicepparam --stdout > /dev/null
