name: Validate application and infrastructure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          node scripts/build-client-questionnaire.mjs --check
          node scripts/build-guided-questionnaire.mjs --check
          node scripts/build-technology-questionnaire.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/lib/legacy-model.test.mjs
      - run: npm run build
      - name: Compile infrastructure and Dev SQL parameters
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/github-api-deployment.bicep --stdout > /dev/null
          az bicep build-params --file infra/github-api-deployment.dev.bicepparam --stdout > /dev/null
          az bicep build --file infra/api-network.bicep --stdout > /dev/null
          az bicep build-params --file infra/api-network.dev.bicepparam --stdout > /dev/null
          az bicep build --file infra/sql.bicep --stdout > /dev/null
          az bicep build --file infra/sql-validation.bicep --stdout > /dev/null
          az bicep build --file infra/migration-access.bicep --stdout > /dev/null
          az bicep build-params --file infra/sql.dev.bicepparam --stdout > /dev/null
          az bicep build --file infra/account-email.bicep --stdout > /dev/null
          az bicep build-params --file infra/account-email.dev.bicepparam --stdout > /dev/null
      - name: Install browser for customer entry tests
        run: npx playwright install --with-deps chromium
      - name: Check customer and staff entry points
        run: npx playwright test --config playwright.management.config.ts
        env:
          VITE_API_BASE_URL: http://127.0.0.1:7071/api
          VITE_ENTRA_CLIENT_ID: browser-tests-only
