name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck --workspace @nso-audit/api

      - name: Build API
        run: npm run build --workspace @nso-audit/api

      - name: Test API and migration model
        run: |
          npm test --workspace @nso-audit/api
          node --test scripts/lib/legacy-model.test.mjs

      - name: Assemble deployment package
        shell: bash
        run: |
          mkdir api-package
          cp apps/api/host.json apps/api/package.json api-package/
          cp -R apps/api/dist api-package/dist
          cd api-package
          npm install --omit=dev --ignore-scripts

      - name: Sign in to Azure with the dedicated deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_API_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_API_DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_API_DEPLOY_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: nso-audit-dev-api-flex
          package: api-package

      - name: Check deployed runtime health
        run: curl --fail --retry 8 --retry-delay 5 --retry-all-errors https://nso-audit-dev-api-flex.azurewebsites.net/api/health
