name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck --workspace @nso-audit/api

      - name: Build API
        run: npm run build --workspace @nso-audit/api

      - name: Assemble deployment package
        shell: bash
        run: |
          mkdir api-package
          cp apps/api/host.json apps/api/package.json api-package/
          cp -R apps/api/dist api-package/dist
          cd api-package
          npm install --omit=dev --ignore-scripts

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: nso-audit-dev-api
          package: api-package
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
