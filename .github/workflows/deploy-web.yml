name: Deploy web

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "config/environments/**"
      - "scripts/Write-NsoAuditWebEnvironment.mjs"
      - ".github/workflows/deploy-web.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load public Dev configuration
        run: node scripts/Write-NsoAuditWebEnvironment.mjs config/environments/dev.public.json

      - name: Build static frontend
        run: npm run build --workspace @nso-audit/web

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
