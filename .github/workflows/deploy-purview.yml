name: Deploy Purview worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/purview/**"
      - "scripts/Publish-NsoAuditPurview.ps1"
      - ".github/workflows/deploy-purview.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-purview-development
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PURVIEW_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_PURVIEW_DEPLOY_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_PURVIEW_DEPLOY_SUBSCRIPTION_ID }}
      - name: Publish DLP collector
        shell: pwsh
        env:
          PURVIEW_SUBSCRIPTION: ${{ vars.AZURE_PURVIEW_DEPLOY_SUBSCRIPTION_ID }}
        run: |
          ./scripts/Publish-NsoAuditPurview.ps1 -SubscriptionId $env:PURVIEW_SUBSCRIPTION -ResourceGroupName NSO-Audit -FunctionAppName nso-audit-dev-pur-api
      - name: Verify Purview collector health
        run: |
          curl --fail --retry 8 --retry-delay 5 --retry-all-errors https://nso-audit-dev-pur-api.azurewebsites.net/api/health | jq -e '.service == "purview-collector" and .status == "ok"'
